name: Update arXiv papers

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fetch-arxiv.mjs"
      - ".github/workflows/update-arxiv.yml"
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch arXiv papers
        env:
          ARXIV_AUTHOR: Antonio Lamanna
        run: node scripts/fetch-arxiv.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/arxiv.json)" ]]; then
            git add data/arxiv.json
            git commit -m "chore: refresh arXiv papers"
            git push
          else
            echo "No arXiv changes."
          fi
