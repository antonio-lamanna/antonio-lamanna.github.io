name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows:
      - Update writing
      - Update arXiv papers
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild book cover
        run: cat assets/book-cover.b64.* | tr -d '\n' | base64 --decode > assets/low-code-strategy-cover.jpg

      - name: Verify book cover
        run: |
          test -s assets/low-code-strategy-cover.jpg
          test "$(wc -c < assets/low-code-strategy-cover.jpg)" -gt 10000
          file assets/low-code-strategy-cover.jpg | grep -qi jpeg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
