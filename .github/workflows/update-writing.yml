name: Update writing

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fetch-medium.mjs"
      - ".github/workflows/update-writing.yml"
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Medium and curated publications
        env:
          MEDIUM_FEED_URL: https://medium.com/feed/@antoniolamanna
        run: node scripts/fetch-medium.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/writing.json)" ]]; then
            git add data/writing.json
            git commit -m "chore: refresh writing"
            git push
          else
            echo "No writing changes."
          fi
